<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="智能选校测评">
  <!-- 白色圆形底，保证在蓝色头部渐变和浅色背景上都清晰 -->
  <circle cx="48" cy="48" r="44" fill="#ffffff"/>
  <!-- 放大镜：镜圈 + 手柄（选校 = 帮你找到合适的学校） -->
  <circle cx="48" cy="48" r="33" fill="none" stroke="#2563eb" stroke-width="7.5"/>
  <line x1="69" y1="69" x2="79" y2="79" stroke="#2563eb" stroke-width="8.5" stroke-linecap="round"/>
  <!-- 学士帽：帽板 -->
  <polygon points="48,26 70,38 48,50 26,38" fill="#1e40af"/>
  <!-- 学士帽：帽托 -->
  <path d="M39,43 L57,43 L54,58 Q48,61 42,58 Z" fill="#93c5fd"/>
  <!-- 流苏（琥珀色点缀） -->
  <path d="M48,25 C51,29 57,33 64,36" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <circle cx="65" cy="37" r="4" fill="#fbbf24"/>
  <!-- 镜片内 AI 星芒 -->
  <path d="M60,57 C60.8,60.2 62.2,61.8 65,62.6 C62.2,63.4 60.8,65 60,68.2 C59.2,65 57.8,63.4 55,62.6 C57.8,61.8 59.2,60.2 60,57 Z" fill="#fbbf24"/>
</svg>
