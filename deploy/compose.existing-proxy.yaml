# 已有宿主机反向代理时使用，不启动 Caddy，不占用 80/443。
services:
  app:
    build:
      context: ..
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers"]
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请配置 DEEPSEEK_API_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?请配置强随机 ADMIN_TOKEN}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      WECOM_WEBHOOK_URL: ${WECOM_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO:-}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-600}
      EVALUATE_RATE_LIMIT: ${EVALUATE_RATE_LIMIT:-10}
      LEAD_RATE_LIMIT: ${LEAD_RATE_LIMIT:-20}
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - leads:/app/data
volumes:
  leads:
